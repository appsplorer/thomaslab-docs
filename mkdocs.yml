site_name: Thomas Lab Research Handbook
site_description: Independent, reproducible clinical research methods documentation for Thomas Lab collaborators.
site_url: https://appsplorer.github.io/thomaslab-docs/
repo_url: https://github.com/appsplorer/thomaslab-docs
repo_name: appsplorer/thomaslab-docs
edit_uri: edit/main/docs/
copyright: Research-use documentation only. Not a medical device, clinical decision support, or institutional data-use approval.
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  icon:
    logo: material/book-open-page-variant
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

