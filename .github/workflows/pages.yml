name: Publish Thomas Lab Research Handbook
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install standalone documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Public content preflight
        run: python scripts/check_public_docs.py
      - name: Build MkDocs site strictly
        run: mkdocs build --strict
      - name: Check essential output pages
        run: |
          test -s site/index.html
          test -s site/getting-started/first-session/index.html
          test -s site/tutorials/dataset-onboarding/index.html
          test -s site/reference/functions/index.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: built-documentation
          path: site/


  python39-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install standalone documentation dependencies on Python 3.9
        run: python -m pip install -r requirements-docs.txt
      - name: Run public-content and compatibility preflight
        run: python scripts/check_public_docs.py
      - name: Strict MkDocs build on Python 3.9
        run: python -m mkdocs build --strict

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, python39-docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: built-documentation
          path: site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
